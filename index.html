<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Pro Futsal Touch</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="game-shell">
    <section class="hud top-hud">
      <div>
        <strong>Pro Futsal Touch</strong>
        <span>inspirado no modo jogador do Pro Clubs</span>
      </div>
      <div class="scoreboard"><span>Casa 0</span><span>00:00</span><span>Fora 0</span></div>
    </section>

    <canvas id="game" aria-label="Jogo de futsal com controles touch"></canvas>

    <section class="hud camera-panel" aria-label="Controles de câmera">
      <button class="active" data-camera="broadcast">TV</button>
      <button data-camera="vertical">Vertical</button>
      <button data-camera="third">3ª pessoa</button>
      <button id="followBall" class="hidden">Seguir bola</button>
    </section>

    <section class="touch-controls" aria-label="Controles touch">
      <div id="joystick" class="joystick"><span></span></div>
      <div class="actions">
        <button id="passBtn">Passe</button>
        <button id="shootBtn">Chute</button>
        <button id="sprintBtn">Sprint</button>
      </div>
    </section>

    <p class="tip">Celular: arraste o analógico, toque em Passe/Chute/Sprint. Desktop: WASD/setas, J/K/L e C para câmera.</p>
  </main>
  <script src="game.js"></script>
</body>
</html>
